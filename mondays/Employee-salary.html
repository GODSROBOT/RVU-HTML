<!DOCTYPE html>
<html>
<head><title>Employee Salary</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 40px;
        }

        h2 {
            text-align: center;
            color: #020202;
            border-bottom: 1px solid orange;
            box-shadow: #ff7300;
        }

        table {
            width: 70%;
            margin: 20px auto;
            border-collapse: collapse;
            background-color: white;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        th {
            background-color: #ff7300;
            color: white;
            padding: 12px;
            text-align: center;
        }

        td {
            padding: 12px;
            text-align: center;
            color: #333;
            font-family: cursive;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tr:hover {
            background-color: #dbeafe;
        }
    </style>
</head>
<body>
<h2>Employee Salary Details</h2>
<table border="1" cellpadding="10">
<tr><th>ID</th><th>Name</th><th>Department</th><th>Salary</th></tr>
<tr><td>1</td><td>Anil</td><td>IT</td><td>45000</td></tr>
<tr><td>2</td><td>Meena</td><td>HR</td><td>40000</td></tr>
<tr><td>3</td><td>Ravi</td><td>Finance</td><td>50000</td></tr>
</table>
</body>
</html>
