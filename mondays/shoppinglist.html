<!DOCTYPE html>
<html>
<head><title>Shopping List</title>
    <style>
         body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 40px;
        }

        h2 {
            text-align: center;
            color: #020202;
            border-bottom: 1px solid orange;
            box-shadow: #ff7300;
        }

        ul {
            padding: 30px;
            padding-bottom: 15px;
            padding-top: 15px;
            border: 1px solid #020202;
            background-color: #ff730034;
        }
        li {
            margin: 15px;
            font-family: cursive;
            text-decoration: underline;
            transition: 0.2s ease;

        }
        li :hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 12px rgba(233, 89, 7, 0.2);
        }
            
    </style>
</head>
<body>
<h2>Shopping List</h2>
<ul>
<li>Rice</li>
<li>Milk</li>
<li>Bread</li>
<li>Fruits</li>
<li>Vegetables</li>
</ul>
</body>
</html>
