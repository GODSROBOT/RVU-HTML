<!DOCTYPE html>
<html>
<head>
    <title>Change Text Color</title>
</head>
<body>
    <h2 id="text">JavaScript is Easy to Learn</h2>

    <button onclick="changeColor()">Change Color</button>

    <script>
        function changeColor() {
            document.getElementById("text").style.color = "Orange";
        }
    </script>
</body>
</html>
