<!DOCTYPE html>
<html>
<head>
    <title>Display Message</title>
</head>
<body>
    <h2>JavaScript Message</h2>
    <button onclick="showMessage()">Click Me</button>
    <p id="output"></p>

    <script>
        function showMessage() {
            document.getElementById("output").innerHTML =
                "Hello! Welcome to JavaScript.";
        }
    </script>
</body>
</html>
