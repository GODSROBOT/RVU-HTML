<!DOCTYPE html>
<html>
<head>
    <title>Press the Button</title>
</head>

<body>

    <h1>Click on this below button</h1>

    <button type="button" onclick="AddNum()">Click me</button>
    <button type="button" onclick="reset()">Reset</button>

    <h2 id="num"></h2>

    <script>
        let nums = 0;

        function AddNum() {
            nums++;
            document.getElementById("num").innerHTML =
                "Button was clicked these times = " + nums;
        }

        function reset() {
            nums = 0;

            document.getElementById("num").innerHTML =
                "Button was clicked these times = " + nums;
        }
    </script>

</body>
</html>
