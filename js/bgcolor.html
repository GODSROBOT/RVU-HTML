<!DOCTYPE html>
<html>
<head>
    <title>Background Color</title>
</head>
<body>
    <h2>Change Background Color</h2>

    <button onclick="changeBackground()">
        Change Background
    </button>

    <script>
        function changeBackground() {
            document.body.style.backgroundColor = "Orange";
        }
    </script>
</body>
</html>
